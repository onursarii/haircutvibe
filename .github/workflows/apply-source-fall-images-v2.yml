name: Apply exact source images v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: github.event.head_commit.message != 'Apply exact source images from Southern Living'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map exact source images
        shell: python
        run: |
          import html,re,requests
          from pathlib import Path
          wf=Path('.github/workflows/apply-source-fall-images.yml').read_text()
          names=re.findall(r"['\"]([^'\"]+\.(?:jpg|png))['\"]",wf)
          if len(names)!=45: raise SystemExit(f'Expected 45 image names, found {len(names)}')
          source=html.unescape(requests.get('https://www.southernliving.com/fashion-beauty/hairstyles/popular-hairstyles',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text)
          found=[]
          for n in names:
              m=re.search(r"https://www\\.southernliving\\.com/thmb/[^\"'<>\\s]*"+re.escape(n),source)
              if not m: raise SystemExit('Missing source image: '+n)
              found.append(m.group(0))
          p=Path('fall-2026-haircut-trends/index.html'); s=p.read_text()
          imgs=re.findall(r'<img\s+src="([^"]+)"',s)
          if len(imgs)<45: raise SystemExit(f'Expected 45 page images, found {len(imgs)}')
          for i,u in enumerate(found): s=s.replace(imgs[i],u,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fall-2026-haircut-trends/index.html
          git commit -m 'Apply exact source images from Southern Living' || exit 0
          git push
