name: Convert Trend Cards To Gallery

on:
  push:
    branches: [main]

jobs:
  update-gallery:
    if: ${{ !contains(github.event.head_commit.message, 'Convert trend cards to horizontal gallery') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert cards to horizontal gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fall-2026-haircut-trends/index.html')
          s = p.read_text(encoding='utf-8')
          old = '.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.item img{width:100%;height:285px;object-fit:cover;display:block}'
          new = '.grid{display:flex;gap:22px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:4px 2px 18px;margin-right:-2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.item{flex:0 0 calc((100% - 44px)/3);scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.item img{width:100%;height:300px;object-fit:cover;display:block}'
          if old not in s:
              raise SystemExit('Expected gallery CSS was not found')
          s = s.replace(old, new, 1)
          old_media = '@media(max-width:800px){.grid{grid-template-columns:1fr}.navlinks>a{display:none}.menu{position:fixed;right:12px;top:65px;width:min(300px,calc(100vw - 24px));grid-template-columns:1fr}.item img{height:260px}.hero{padding-top:35px}}'
          new_media = '@media(max-width:800px){.navlinks>a{display:none}.menu{position:fixed;right:12px;top:65px;width:min(300px,calc(100vw - 24px));grid-template-columns:1fr}.item{flex-basis:78vw}.item img{height:300px}.hero{padding-top:35px}}@media(max-width:500px){.item{flex-basis:88vw}.item img{height:330px}}'
          if old_media not in s:
              raise SystemExit('Expected mobile CSS was not found')
          s = s.replace(old_media, new_media, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit gallery update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fall-2026-haircut-trends/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Convert trend cards to horizontal gallery'
          git push
