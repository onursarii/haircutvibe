name: Reduce fall trends to 20

on:
  push:
    paths:
      - '.reduce-fall-trends-trigger'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reduce and verify page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, re, urllib.request, os
          repo='onursarii/haircutvibe'; path='fall-2026-haircut-trends/index.html'
          api=f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
          h={'Authorization':f'Bearer {os.environ["GH_TOKEN"]}','Accept':'application/vnd.github+json'}
          data=json.load(urllib.request.urlopen(urllib.request.Request(api,headers=h))); html=base64.b64decode(data['content']).decode()
          expected=['Textured Layers','Short and Wild Shag','Blunt Collarbone Cut','Soft Curved Bob','Wispy Bangs','Cheekbone-Grazing 90s Bob','Mia Wallace Bob','Mini Blunt Bob','Blunt Textured Cut','Curtain Bangs','Short Shag Cut','Sharp Shoulder Cut','1970s Long Cut','Lob-Length Curls','Choppy Layers','Curly Pixie Cut','Blunt Chin Bob','Barely-There Bangs','Textured Fringe Bob','Textured Lob']
          source=urllib.request.urlopen('https://www.southernliving.com/fashion-beauty/hairstyles/popular-hairstyles').read().decode('utf-8','ignore')
          for t in expected:
              if t not in source: raise SystemExit(f'Source verification failed: {t}')
          a=html.index('<section class="grid">'); b=html.index('</section>',a)+10
          cards=re.findall(r'<article class="item">.*?</article>',html[a:b],re.S)
          if len(cards)<20: raise SystemExit(f'Only {len(cards)} cards found')
          cards=cards[:20]
          for i,(card,title) in enumerate(zip(cards,expected),1):
              m=re.search(r'<h2>\d+\. (.*?)</h2>',card)
              if not m or m.group(1).strip()!=title: raise SystemExit(f'Card {i} mismatch')
              u=re.search(r'<img src="([^"]+)"',card).group(1)
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,method='HEAD',headers={'User-Agent':'Mozilla/5.0'}),timeout=15)
                  if r.status!=200: raise Exception(r.status)
              except Exception as e: raise SystemExit(f'Image check failed for card {i}: {e}')
          html=html[:a]+'<section class="grid">'+''.join(cards)+'</section>'+html[b:]
          repl=[('<title>45 Fall 2026 Haircut Trends: Bobs, Bangs, Layers & Curls | HaircutVibe</title>','<title>20 Fall 2026 Haircut Trends: Bobs, Bangs, Layers & Curls | HaircutVibe</title>'),('Explore 45 fall 2026 haircut ideas','Explore 20 fall 2026 haircut ideas'),('<h1>45 Fall 2026 Haircut Trends Worth Saving</h1>','<h1>20 Fall 2026 Haircut Trends Worth Saving</h1>'),('We rounded up 45 haircut ideas','We rounded up 20 haircut ideas'),('currently features 45 fall 2026 cuts','currently features 45 fall 2026 cuts; this guide selects the first 20')]
          for x,y in repl: html=html.replace(x,y)
          body=json.dumps({'message':'Reduce fall 2026 haircut trends guide to 20 verified styles','content':base64.b64encode(html.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
          put=urllib.request.Request(api,data=body,method='PUT',headers={**h,'Content-Type':'application/json'})
          print(json.load(urllib.request.urlopen(put))['commit']['sha'])
          PY
