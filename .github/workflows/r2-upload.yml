name: Upload images to Cloudflare R2

on:
  workflow_dispatch:
  push:
    paths:
      - "r2-staging/**"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload staged images to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -e
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          find r2-staging -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" \) -print0 | while IFS= read -r -d '' file; do
            target="${file#r2-staging/}"
            echo "Uploading ${target}"
            aws s3 cp "${file}" "s3://${R2_BUCKET}/${target}" --endpoint-url "${ENDPOINT}"
          done

          echo "R2 upload completed."
