name: Apply verified source image URLs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    if: github.event.head_commit.message != 'Apply exact source images from Southern Living'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified URLs
        shell: python
        run: |
          import re
          from pathlib import Path
          wf=Path('.github/workflows/apply-source-fall-images.yml').read_text()
          urls=re.findall(r'https://www\.southernliving\.com/thmb/[^\s\'\"]+',wf)
          if len(urls)!=45: raise SystemExit(f'Expected 45 verified URLs, found {len(urls)}')
          p=Path('fall-2026-haircut-trends/index.html'); s=p.read_text()
          imgs=re.findall(r'<img\s+src="([^"]+)"',s)
          if len(imgs)<45: raise SystemExit(f'Expected 45 page images, found {len(imgs)}')
          for i,u in enumerate(urls): s=s.replace(imgs[i],u,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fall-2026-haircut-trends/index.html
          git commit -m 'Apply exact source images from Southern Living' || exit 0
          git push
